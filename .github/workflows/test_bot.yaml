name: Test Bot

on:
  pull_request:
  workflow_dispatch:
    inputs:
      live_dry_run:
        description: "Forecast one bot-testing-area question without submitting (spends OpenRouter credit)"
        type: boolean
        default: false

permissions:
  contents: read

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Unit tests do not call Metaculus, OpenRouter, or AskNews.
# The optional live dry run forecasts one question and does not publish it.
jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run unit tests
        run: poetry run python -m unittest discover -s tests -t . -v

  live_dry_run:
    if: github.event_name == 'workflow_dispatch' && inputs.live_dry_run
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Restore OpenRouter spend ledger
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: logs/openrouter_spend.json
          key: openrouter-spend-${{ github.run_id }}
          restore-keys: |
            openrouter-spend-
      - name: Run bot without submitting
        run: |
          poetry run python main.py --mode test_questions --dry-run --max-questions 1
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
      - name: Show spend ledger
        if: always()
        run: |
          if [ -f logs/openrouter_spend.json ]; then
            python -c 'import json; d=json.load(open("logs/openrouter_spend.json")); print({k: d[k] for k in ("remote_usd", "gap_usd", "usage_known") if k in d})'
          else
            echo "No spend ledger. Forecasting is refused when OpenRouter usage is unknown."
          fi
      - name: Save OpenRouter spend ledger
        if: always() && hashFiles('logs/openrouter_spend.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: logs/openrouter_spend.json
          key: openrouter-spend-${{ github.run_id }}
