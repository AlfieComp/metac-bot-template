name: Forecast on Metaculus Cup

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Forecast without publishing to Metaculus"
        type: boolean
        default: true
      max_questions:
        description: "Maximum open questions to forecast in each tournament"
        type: number
        default: 3
  # The every-other-day schedule stays off until a live dry run has been checked.
  # Nothing on this workflow submits until someone runs it by hand.
  # schedule:
  #   - cron: "0 0 */2 * *" # runs at midnight every 2 days

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Restore OpenRouter spend ledger
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: logs/openrouter_spend.json
          key: openrouter-spend-${{ github.run_id }}
          restore-keys: |
            openrouter-spend-
      - name: Run bot
        # A manual run defaults to a dry run of 3 questions. A schedule, once
        # the cron above is restored, leaves both values empty and submits with no cap.
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$MAX_QUESTIONS" ]; then
            args+=(--max-questions "$MAX_QUESTIONS")
          fi
          poetry run python main.py --mode metaculus_cup "${args[@]}"
        # Secrets stay in the environment. Do not print them.
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MAX_QUESTIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_questions || '' }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
      - name: Show spend ledger
        if: always()
        run: |
          if [ -f logs/openrouter_spend.json ]; then
            python -c 'import json; d=json.load(open("logs/openrouter_spend.json")); print({k: d[k] for k in ("remote_usd", "gap_usd", "usage_known") if k in d})'
          else
            echo "No spend ledger. Forecasting is refused when OpenRouter usage is unknown."
          fi
      - name: Save OpenRouter spend ledger
        if: always() && hashFiles('logs/openrouter_spend.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: logs/openrouter_spend.json
          key: openrouter-spend-${{ github.run_id }}